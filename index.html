<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Francisco J. Ramírez Aliaga</title>
<meta name="description" content="Francisco J. Ramírez Aliaga: credit risk, portfolio oversight and AI in private credit.">
<style>
:root{
  --bg:#faf9f5;--panel:#fff;--fg:#1f1e1d;--muted:#6b6a66;--line:#e6e3da;--accent:#c2410c;
  --serif:Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#1a1918;--panel:#242321;--fg:#ece9e2;--muted:#a19e96;--line:#3a3835;--accent:#f0884e;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.55}
main{max-width:720px;margin:0 auto;padding:96px 24px 64px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,6vw,2.75rem);line-height:1.15;margin:0 0 12px}
.links{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 56px}
.links a{color:var(--accent);text-decoration:none;font-weight:500}
.links a:hover{text-decoration:underline}
h2{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;color:inherit;text-decoration:none;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .t{font-family:var(--serif);font-size:1.25rem}
.card .d{color:var(--muted);font-size:.9rem;margin-top:4px}
footer{margin-top:72px;font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Francisco J. Ramírez Aliaga</h1>
  <p class="links">
    <a href="https://www.linkedin.com/in/fjraliaga/" target="_blank" rel="noopener">LinkedIn →</a>
  </p>

  <h2>Work</h2>
  <a class="card" href="/cocoa/">
    <div class="t">Cocoa thesis tracker</div>
    <div class="d">Kill criteria, scenarios, Ivorian arrivals and catalysts for a long-2027 cocoa view.</div>
  </a>

  <footer>Personal views only. Not investment advice and not affiliated with my employer.</footer>
</main>
</body>
</html>
